<stop offset="0" stop-color="#2a5bd7"/><stop offset=".5" stop-color="#3fd4e0"/><stop offset="1" stop-color="#c79cf0"/></linearGradient></defs>
<path d="M27 10 V66 a22 22 0 0 0 22 22 h6 a22 22 0 0 0 22 -22 v-2 a22 22 0 0 0 -22 -22 h-6 a22 22 0 0 0 -22 20" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="45" y="58" width="14" height="14" rx="4" fill="#3fd4e0"/></g></svg>